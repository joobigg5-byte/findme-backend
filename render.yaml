services:
  - type: web
    name: findme-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: findme-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true

databases:
  - name: findme-db
    plan: free
